name: Scarlet Redwood virtual-bin129 550MHz isolation build
on:
  push:
    branches: [scarlet-129-550-isolation]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install dependencies and LLVM 14
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev device-tree-compiler python3 python-is-python3 ccache clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu
      - name: Configure Redwood kernel and verify KernelSU
        run: |
          make O=out ARCH=arm64 LLVM=-14 vendor/xiaomi-qgki_defconfig
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/redwood.config
          make O=out ARCH=arm64 LLVM=-14 olddefconfig
          grep -qx 'CONFIG_QCOM_KGSL=y' out/.config
          grep -qx 'CONFIG_MACH_XIAOMI_REDWOOD=y' out/.config
          grep -qx 'CONFIG_KSU=y' out/.config
          python3 - <<'PY'
          from pathlib import Path
          s = Path("arch/arm64/boot/dts/vendor/qcom/yupik-gpu.dtsi").read_text()
          section = s.split("qcom,gpu-pwrlevels-4 {", 1)[1].split("qcom,gpu-pwrlevels-5 {", 1)[0]
          assert "qcom,speed-bin = <129>;" in section
          assert "qcom,initial-pwrlevel = <2>;" in section
          assert "qcom,gpu-freq = <608000000>;" not in section
          assert section.count("qcom,gpu-pwrlevel@") == 3
          assert [f"qcom,gpu-freq = <{hz}>;" in section for hz in (550000000,450000000,315000000)] == [True]*3
          PY
          grep -q '129 << 5' drivers/nvmem/qfprom.c
      - name: Build Image and device trees
        run: |
          make O=out ARCH=arm64 LLVM=-14 -j$(nproc) Image.gz dtbs
          test -s out/arch/arm64/boot/Image
          test -s out/arch/arm64/boot/Image.gz
          test -s out/arch/arm64/boot/dts/vendor/qcom/yupik.dtb
          test -s out/arch/arm64/boot/dts/vendor/qcom/redwood-sm7325-overlay.dtbo
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scarlet-redwood-bin129-550-isolation
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/vendor/qcom/yupik.dtb
            out/arch/arm64/boot/dts/vendor/qcom/redwood-sm7325-overlay.dtbo
            out/vmlinux
            out/System.map
            out/.config
          if-no-files-found: error
          retention-days: 14
